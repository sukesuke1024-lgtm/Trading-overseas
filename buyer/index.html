<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H-LINK バイヤーポータル | 卸受注ダッシュボード</title>
<meta name="description" content="国内外のバイヤーと、日本の食をつなぐB2Bマーケットプレイス。商品検索・見積/サンプル依頼・発注・配送トラッキングをひとつの画面で。">
<meta name="theme-color" content="#d3212d">
<link rel="icon" href="assets/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#view">本文へスキップ</a>

<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="メニューを開く" aria-expanded="false"><svg class="ic"><use href="#i-menu"/></svg></button>
  <a class="brand" href="#/" aria-label="H-LINK トップへ"><img src="assets/logo.png" alt="H-LINK" height="34"></a>
  <form class="top-search" id="topSearch" role="search">
    <input type="search" id="topQ" placeholder="商品名・キーワード・産地で検索" aria-label="商品検索" autocomplete="off">
    <button type="submit" aria-label="検索"><svg class="ic"><use href="#i-search"/></svg></button>
  </form>
  <div class="top-right">
    <div class="pop-wrap">
      <button class="icon-btn" id="bellBtn" aria-label="通知" aria-expanded="false"><svg class="ic"><use href="#i-bell"/></svg><span class="dot" id="bellDot" hidden></span></button>
      <div class="pop" id="bellPop" hidden></div>
    </div>
    <a class="user" href="#/account"><span class="avatar" id="userAvatar">B</span><span class="user-name" id="userName">バイヤー様</span></a>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="メインメニュー">
    <a href="#/" data-nav="home"><svg class="ic"><use href="#i-home"/></svg>ダッシュボード</a>
    <a href="#/search" data-nav="search"><svg class="ic"><use href="#i-search"/></svg>商品を探す</a>
    <a href="#/categories" data-nav="categories"><svg class="ic"><use href="#i-grid"/></svg>カテゴリー</a>
    <a href="#/favorites" data-nav="favorites"><svg class="ic"><use href="#i-heart"/></svg>お気に入り<span class="badge" id="navFav"></span></a>
    <a href="#/requests" data-nav="requests"><svg class="ic"><use href="#i-doc"/></svg>見積・サンプル依頼<span class="badge" id="navReq"></span></a>
    <a href="#/orders" data-nav="orders"><svg class="ic"><use href="#i-clock"/></svg>発注履歴<span class="badge" id="navOrd"></span></a>
    <a href="#/messages" data-nav="messages"><svg class="ic"><use href="#i-chat"/></svg>メッセージ<span class="badge red" id="navMsg"></span></a>
    <a href="#/account" data-nav="account"><svg class="ic"><use href="#i-gear"/></svg>アカウント設定</a>
    <a href="guide.html" target="_blank" rel="noopener"><svg class="ic"><use href="#i-doc"/></svg>使い方ガイド</a>
    <div class="side-foot">
      <button class="link-btn" id="resetDemo">デモデータを初期化</button>
      <small>© H-LINK Buyer Portal (demo)</small>
    </div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>
  <main id="view" tabindex="-1"></main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modalRoot" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 1 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="m20 11-8.2 8.2a5 5 0 0 1-7-7L13 4a3.3 3.3 0 0 1 4.7 4.7l-8.3 8.2a1.7 1.7 0 0 1-2.4-2.4L14 7.5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M3 11.5 21 4l-7.5 17-2.5-7.5z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-handshake" viewBox="0 0 24 24"><path d="M2 12l4-4 4 1 3-2 4 2 5 3-3 3M2 12l5 5 3-1 2 2 3-1 2 2"/><path d="m10 14 2 1"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3.2 3 13.8 0 17M12 3.5c-3 3.2-3 13.8 0 17"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6M20 16v-9" stroke-linecap="round"/></symbol>
    <symbol id="i-gem" viewBox="0 0 24 24"><path d="M6 4h12l3 5-9 11L3 9z"/><path d="M3 9h18M9 4l-2 5 5 11 5-11-2-5"/></symbol>
  </defs>
</svg>

<script src="app.js"></script>
</body>
</html>
