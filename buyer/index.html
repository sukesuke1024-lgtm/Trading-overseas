<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H-LINK バイヤーポータル | 卸受注ダッシュボード</title>
<meta name="description" content="国内外のバイヤーと、日本の食をつなぐB2Bマーケットプレイス。商品検索・見積/サンプル依頼・発注・配送トラッキングをひとつの画面で。">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#d3212d">
<link rel="icon" href="assets/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#view">本文へスキップ</a>

<section class="login" id="login" aria-labelledby="loginTitle">
  <div class="login-art" aria-hidden="true"><img src="assets/hero-sunrise.webp" alt=""></div>
  <div class="login-panel">
    <div class="login-top"><img src="assets/logo.png" alt="H-LINK" height="36">
      <select class="in lang-sel" id="loginLang" aria-label="言語"><option value="ja">日本語</option><option value="en">English</option><option value="zh">简体中文</option></select></div>
    <form class="login-card" id="loginForm" autocomplete="off" novalidate>
      <h1 id="loginTitle">バイヤーポータル ログイン</h1>
      <p class="pmeta">社内および卸の関係者専用です。発行されたIDとパスワードでログインしてください。</p>
      <label class="f" for="lgId">ログインID</label>
      <input class="in" id="lgId" name="id" autocapitalize="off" spellcheck="false" maxlength="40" required>
      <label class="f" for="lgPw">パスワード</label>
      <input class="in" id="lgPw" name="pw" type="password" autocomplete="off" maxlength="80" required>
      <p class="login-err" id="loginErr" role="alert" hidden></p>
      <button class="btn block" id="loginBtn" type="submit" style="margin-top:16px">ログイン</button>
      <p class="pmeta" style="margin-top:14px">セッションは一定時間操作がないと自動的にログアウトされます。</p>
    </form>
    <small class="login-foot">&copy; H-LINK Buyer Portal (demo)</small>
  </div>
</section>

<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="メニューを開閉" aria-expanded="false" aria-controls="side"><svg class="ic"><use href="#i-menu"/></svg></button>
  <div class="navbtns">
    <button class="icon-btn" id="navBack" aria-label="前のページへ戻る" title="戻る" disabled><svg class="ic"><use href="#i-back"/></svg></button>
    <button class="icon-btn" id="navFwd" aria-label="次のページへ進む" title="進む" disabled><svg class="ic"><use href="#i-fwd"/></svg></button>
  </div>
  <a class="brand" href="#/" aria-label="H-LINK トップへ"><img src="assets/logo.png" alt="H-LINK" height="34"></a>
  <form class="top-search" id="topSearch" role="search">
    <input type="search" id="topQ" placeholder="商品名・キーワード・産地で検索" aria-label="商品検索" autocomplete="off">
    <button type="submit" aria-label="検索"><svg class="ic"><use href="#i-search"/></svg></button>
  </form>
  <div class="top-right">
    <span class="demo-tag">DEMO版・関係者限定</span>
    <a class="company-link" id="companyLink" href="#" target="_blank" rel="noopener noreferrer" hidden><svg class="ic"><use href="#i-ext"/></svg><span>会社サイト</span></a>
    <select class="in lang-sel" id="langSel" aria-label="言語"><option value="ja">日本語</option><option value="en">English</option><option value="zh">简体中文</option></select>
    <div class="pop-wrap">
      <button class="icon-btn" id="bellBtn" aria-label="通知" aria-expanded="false"><svg class="ic"><use href="#i-bell"/></svg><span class="dot" id="bellDot" hidden></span></button>
      <div class="pop" id="bellPop" hidden></div>
    </div>
    <div class="pop-wrap">
      <button class="user" id="userBtn" aria-haspopup="true" aria-expanded="false"><span class="avatar" id="userAvatar">B</span><span class="user-name" id="userName">バイヤー様</span></button>
      <div class="pop user-pop" id="userPop" hidden>
        <div class="up-head"><b id="upName"></b><small id="upRole"></small></div>
        <a href="#/account"><svg class="ic"><use href="#i-gear"/></svg>アカウント設定</a>
        <a href="guide.html" target="_blank" rel="noopener noreferrer"><svg class="ic"><use href="#i-doc"/></svg>使い方ガイド</a>
        <button id="logoutBtn" type="button"><svg class="ic"><use href="#i-logout"/></svg>ログアウト</button>
      </div>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="メインメニュー">
    <a href="#/" data-nav="home"><svg class="ic"><use href="#i-home"/></svg>ダッシュボード</a>
    <a href="#/search" data-nav="search"><svg class="ic"><use href="#i-search"/></svg>商品を探す</a>
    <a href="#/categories" data-nav="categories"><svg class="ic"><use href="#i-grid"/></svg>カテゴリー</a>
    <a href="#/favorites" data-nav="favorites"><svg class="ic"><use href="#i-heart"/></svg>お気に入り<span class="badge" id="navFav"></span></a>
    <a href="#/requests" data-nav="requests"><svg class="ic"><use href="#i-doc"/></svg>見積・サンプル依頼<span class="badge" id="navReq"></span></a>
    <a href="#/orders" data-nav="orders"><svg class="ic"><use href="#i-clock"/></svg>発注履歴<span class="badge" id="navOrd"></span></a>
    <a href="#/messages" data-nav="messages"><svg class="ic"><use href="#i-chat"/></svg>メッセージ<span class="badge red" id="navMsg"></span></a>
    <a href="#/account" data-nav="account"><svg class="ic"><use href="#i-gear"/></svg>アカウント設定</a>
    <a href="guide.html" target="_blank" rel="noopener noreferrer"><svg class="ic"><use href="#i-doc"/></svg>使い方ガイド</a>
    <a class="side-company" id="sideCompany" href="#" target="_blank" rel="noopener noreferrer" hidden><svg class="ic"><use href="#i-ext"/></svg>会社サイトへ</a>
    <div class="side-foot">
      <button class="link-btn" id="resetDemo">デモデータを初期化</button>
      <small>&copy; H-LINK Buyer Portal (demo)</small>
    </div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>
  <main id="view" tabindex="-1"></main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modalRoot" hidden></div>
