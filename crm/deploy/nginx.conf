server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # セキュリティヘッダー（社内ポータルと同じ方針。外部ドメインは為替レート取得の frankfurter.app のみ許可）
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https:; frame-src 'self' about:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
  location / { try_files $uri $uri/ =404; }
}
