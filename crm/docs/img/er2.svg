<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="IPAGothic, sans-serif">
<rect width="1200" height="640" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55565e"/></marker></defs>
<g stroke="#55565e" stroke-width="1.6" fill="none" marker-end="url(#a)">
<path d="M300 150H440"/><path d="M600 230V300"/><path d="M760 140H880"/><path d="M440 390H300"/><path d="M760 400H880"/><path d="M600 480V520"/><path d="M880 250H760"/><path d="M1040 230V300"/><path d="M880 560H850"/>
</g>
<g font-size="13">
<g><rect x="20" y="70" width="280" height="150" rx="8" fill="#fff" stroke="#1f1f24" stroke-width="2"/><text x="34" y="94" font-weight="700" font-size="15" fill="#1f1f24">products（商品カタログ）</text><text x="34" y="118">id / sku / name / name_en / category</text><text x="34" y="140">spec / unit / moq / storage / hs_code</text><text x="34" y="162">cost_jpy（社外秘）/ price_usd</text><text x="34" y="184">certs / description / active</text></g>
<g><rect x="440" y="70" width="320" height="160" rx="8" fill="#e8eef7" stroke="#1f3a5f"/><text x="454" y="94" font-weight="700" font-size="15" fill="#1f3a5f">deal_lines（案件の明細）</text><text x="454" y="118">id / deal_id / product_id</text><text x="454" y="140">name / qty / unit / unit_price</text><text x="454" y="162">※ 単価は案件ごとに固定</text><text x="454" y="184">deals.amount = Σ qty × unit_price</text></g>
<g><rect x="880" y="70" width="300" height="180" rx="8" fill="#f1f1ee" stroke="#8a8c95"/><text x="894" y="94" font-weight="700" font-size="15" fill="#54565e">deals（既存）に追加</text><text x="894" y="118">pay_term（前払い/L/C/D/P/D/A/O/A）</text><text x="894" y="140">incoterm（EXW〜DDP）</text><text x="894" y="162">decision（契約可否の判定結果）</text><text x="894" y="184">※ amount は明細の合計</text></g>
<g><rect x="440" y="300" width="320" height="180" rx="8" fill="#fff" stroke="#1f1f24" stroke-width="2"/><text x="454" y="324" font-weight="700" font-size="15" fill="#1f1f24">sales（売上）</text><text x="454" y="348">id / no / deal_id / org_id / date</text><text x="454" y="370">currency / lines / amount（外貨）</text><text x="454" y="392">rate（計上レート）/ amount_jpy</text><text x="454" y="414">status / paid_date</text><text x="454" y="436">received_jpy / bank_fee_jpy</text><text x="454" y="458">amount_jpy = round(amount × rate)</text></g>
<g><rect x="20" y="300" width="280" height="150" rx="8" fill="#fff" stroke="#1f1f24" stroke-width="2"/><text x="34" y="324" font-weight="700" font-size="15" fill="#1f1f24">journals（仕訳）</text><text x="34" y="348">id / date / memo / sale_id / kind</text><text x="34" y="370">lines[ 科目コード / 借貸 / 金額 ]</text><text x="34" y="392">借方合計 = 貸方合計（CHECK）</text><text x="34" y="414">売上高(4110) 貸方 = sales.amount_jpy</text></g>
<g><rect x="880" y="300" width="300" height="130" rx="8" fill="#fff" stroke="#1f1f24"/><text x="894" y="324" font-weight="700" font-size="15" fill="#1f1f24">fx_forwards（為替予約）</text><text x="894" y="348">id / bank / currency / amount / rate</text><text x="894" y="370">trade_date / settle_date / status</text><text x="894" y="392">deal_id / note</text></g>
<g><rect x="440" y="520" width="410" height="100" rx="8" fill="#fff" stroke="#1f1f24"/><text x="454" y="544" font-weight="700" font-size="15" fill="#1f1f24">mail_logs（メール配信の記録）</text><text x="454" y="568">id / at / user_id / subject / count</text><text x="454" y="590">filter / via / flyer ＋ 宛先ごとに activities を作成</text></g>
<g><rect x="880" y="480" width="300" height="140" rx="8" fill="#fff" stroke="#1f1f24"/><text x="894" y="504" font-weight="700" font-size="15" fill="#1f1f24">notices（営業部のお知らせ）</text><text x="894" y="528">id / title / body / pinned / date</text><text x="894" y="550">urls[ label / url ]（1件以上必須）</text><text x="894" y="572">author_id ／ 閲覧：営業部＋Manager以上</text></g>
<g><rect x="20" y="490" width="280" height="130" rx="8" fill="#f1f1ee" stroke="#8a8c95"/><text x="34" y="514" font-weight="700" font-size="15" fill="#54565e">contacts / users に追加</text><text x="34" y="538">contacts.opt_out / contacts.lang</text><text x="34" y="560">users.employee_no（ポータルと同じ）</text><text x="34" y="582">users.dept（営業部の判定に使う）</text></g>
</g></svg>
