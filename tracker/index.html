<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H-LINK コンテナ追跡</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>コンテナ追跡 <small>H-LINK</small></h1>
  <div class="actions">
    <button id="btn-add">＋ 登録</button>
    <button id="btn-import" class="ghost">CSV取込</button>
    <button id="btn-export" class="ghost">CSV出力</button>
    <input id="file" type="file" accept=".csv,text/csv" hidden>
  </div>
</header>
<main>
  <section class="summary" id="summary"></section>
  <div class="bar">
    <input id="q" type="search" placeholder="コンテナ番号・B/L・ロット・生産者・取引先で検索">
    <select id="f-stage"><option value="">すべての状態</option></select>
  </div>
  <div class="layout">
    <ul id="list" class="list"></ul>
    <article id="detail" class="detail"></article>
  </div>
</main>
<dialog id="dlg"><form id="form" method="dialog"></form></dialog>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
