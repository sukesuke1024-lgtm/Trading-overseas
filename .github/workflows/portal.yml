name: Mirai Portal

on:
  push:
    paths: ['portal/**', '.github/workflows/portal.yml']
  pull_request:
    paths: ['portal/**', '.github/workflows/portal.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /portal
