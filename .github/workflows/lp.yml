name: Recruitment LP

on:
  push:
    branches: [main, claude/overseas-buyer-sales-recruitment-video-idqyvw]
    paths: ['lp/**', 'portal/**', 'crm/**', 'buyer/**', 'recruit-video/out/**', '.github/workflows/lp.yml']
  pull_request:
    paths: ['lp/**', 'recruit-video/out/**', '.github/workflows/lp.yml']
  workflow_dispatch:
  # 毎時17分に自動実行：CRM の公的データ（為替・制裁リスト・公式ニュース）を取り込み直して再公開する（24時間365日の自動更新）
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: lp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lp/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run check

  deploy:
    # GitHub Pages を「Source: GitHub Actions」で有効にすると公開されます
    if: always() && github.event_name != 'pull_request' && (needs.test.result == 'success' || github.event_name == 'schedule')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        working-directory: lp
        env:
          SITE_URL: ${{ vars.SITE_URL || format('{0}/', steps.pages.outputs.base_url) }}
          CNAME: ${{ vars.CNAME }}
        run: node build.mjs
      # 社内ポータルのデモ版（静的書き出し）を /portal/ 配下に同梱して公開する
      - name: Build portal demo
        working-directory: portal
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}/portal
        run: |
          npm ci
          npm run build:static
          mkdir -p ../lp/dist/portal
          cp -r out/. ../lp/dist/portal/
          touch ../lp/dist/.nojekyll
      # バイヤーポータル（卸受注ダッシュボード・静的サイト）を /buyer/ 配下に同梱して公開する
      - name: Copy buyer portal
        run: |
          mkdir -p lp/dist/buyer
          cp -r buyer/. lp/dist/buyer/
      # 公的データの自動取り込み（為替・OFAC 制裁リスト・官公庁の RSS/Atom）。失敗しても公開は続け、前回の値を残す
      - name: Restore previous public data
        uses: actions/cache/restore@v4
        with:
          path: crm/public/data
          key: crm-data-never-matches
          restore-keys: crm-data-
      - name: Refresh public data (FX / sanctions / official feeds)
        working-directory: crm
        continue-on-error: true
        run: node scripts/refresh-data.mjs
      - name: Save public data for the next run
        uses: actions/cache/save@v4
        if: always()
        with:
          path: crm/public/data
          key: crm-data-${{ github.run_id }}
      # 営業CRM（Phase 1 デモ版・静的書き出し）を /crm/ 配下に同梱して公開する
      - name: Build CRM demo
        working-directory: crm
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}/crm
        run: |
          npm ci
          npm run build:static
          mkdir -p ../lp/dist/crm
          cp -r out/. ../lp/dist/crm/
      # 前の版（Mirai HD 版ポータル）も /portal-v1/ で引き続き使えるように同梱する（固定コミットから別途ビルド）
      - name: Checkout previous portal version
        uses: actions/checkout@v4
        with:
          ref: 682fa3e69b416494cc84ce5cd1199f5dedeaf7da
          path: legacy
      - name: Build previous portal version
        working-directory: legacy/portal
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}/portal-v1
        run: |
          npm ci
          npm run build:static
          mkdir -p ../../lp/dist/portal-v1
          cp -r out/. ../../lp/dist/portal-v1/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lp/dist
      - id: deployment
        uses: actions/deploy-pages@v4
