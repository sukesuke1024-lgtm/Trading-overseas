name: AITREK OS

on:
  push:
    paths: ['aitrek-os/**', '.github/workflows/aitrek-os.yml']
  pull_request:
    paths: ['aitrek-os/**', '.github/workflows/aitrek-os.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aitrek-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aitrek-os/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
