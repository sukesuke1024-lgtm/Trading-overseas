name: Tracker

on:
  workflow_dispatch:
  pull_request:
    paths: ['tracker/**', '.github/workflows/tracker.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check server/relay.js
